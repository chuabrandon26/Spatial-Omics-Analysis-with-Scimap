<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 752" width="1000" height="752" role="img" aria-labelledby="t d">
<title id="t">Visual abstract: Cell phenotypes and neighborhoods in tissue</title>
<desc id="d">Scimap analysis of 11,201 segmented cells with nine protein markers from an MCMICRO exemplar image: manual gating in napari, hierarchical prior-knowledge phenotyping and Leiden clustering, ROI fold changes, four recurrent cellular neighborhoods, and permutation-based spatial interaction and proximity scoring.</desc>
